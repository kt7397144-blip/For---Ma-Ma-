<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>မမအတွက် ဖြူ့ Little Care Surprise 🌙🤍</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Noto Sans Myanmar","Myanmar Text",sans-serif;
  background:#090817;
  color:white;
}

body{
  position:relative;
  background:
    radial-gradient(circle at 50% 20%,#30275b 0%,#14132d 35%,#080817 80%);
}

/* Stars */
.star{
  position:fixed;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  opacity:.7;
  animation:twinkle 2s infinite alternate;
  pointer-events:none;
}

@keyframes twinkle{
  from{opacity:.2;transform:scale(.7)}
  to{opacity:1;transform:scale(1.4)}
}

/* Hearts */
.heart{
  position:fixed;
  pointer-events:none;
  animation:floatHeart 4s linear forwards;
  z-index:10;
}

@keyframes floatHeart{
  0%{
    transform:translateY(0) scale(.7);
    opacity:1;
  }
  100%{
    transform:translateY(-100vh) scale(1.4);
    opacity:0;
  }
}

/* Main */
#app{
  width:100%;
  height:100%;
  position:relative;
}

.scene{
  width:100%;
  height:100%;
  display:none;
  padding:55px 22px 85px;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:absolute;
  inset:0;
  overflow-y:auto;
}

.scene.active{
  display:flex;
  animation:sceneIn .7s ease;
}

@keyframes sceneIn{
  from{
    opacity:0;
    transform:translateY(20px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.card{
  width:min(94%,560px);
  max-height:90vh;
  overflow-y:auto;
  padding:30px 23px;
  border-radius:30px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(15px);
  box-shadow:0 15px 50px rgba(0,0,0,.35);
}

.card::-webkit-scrollbar{
  width:3px;
}

.card::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.3);
  border-radius:20px;
}

h1{
  font-size:34px;
  line-height:1.5;
  margin-bottom:18px;
}

h2{
  font-size:25px;
  line-height:1.6;
  margin-bottom:18px;
}

p{
  font-size:18px;
  line-height:2;
  margin:9px 0;
}

.big{
  font-size:22px;
  line-height:2;
}

.small{
  font-size:15px;
  opacity:.75;
}

.highlight{
  font-size:21px;
  font-weight:bold;
  line-height:1.9;
  margin:15px 0;
}

.emoji{
  font-size:50px;
  margin-bottom:12px;
}

.envelope{
  width:190px;
  height:130px;
  margin:25px auto;
  position:relative;
  background:#fff;
  border-radius:15px;
  box-shadow:0 15px 40px rgba(255,255,255,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8b6688;
  font-size:18px;
  font-weight:bold;
}

.envelope:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  border-left:95px solid transparent;
  border-right:95px solid transparent;
  border-top:70px solid #eaddeb;
}

.envelope span{
  position:relative;
  z-index:2;
  margin-top:45px;
}

button{
  border:none;
  padding:14px 22px;
  margin:8px;
  border-radius:30px;
  font-size:16px;
  font-family:inherit;
  cursor:pointer;
  background:rgba(255,255,255,.94);
  color:#5c4762;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
  transition:.2s;
}

button:active{
  transform:scale(.94);
}

.next{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  background:rgba(255,255,255,.13);
  color:white;
  border:1px solid rgba(255,255,255,.25);
  backdrop-filter:blur(10px);
  padding:10px 18px;
}

.progress{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  display:flex;
  gap:5px;
}

.dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:rgba(255,255,255,.3);
}

.dot.active{
  width:18px;
  background:white;
}

.final{
  font-size:23px;
  line-height:2;
}

.confetti{
  position:fixed;
  top:-20px;
  width:8px;
  height:14px;
  animation:fall 3s linear forwards;
  z-index:30;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<div id="app"></div>
<div class="progress" id="progress"></div>
<button class="next" id="nextBtn" onclick="nextScene()">ဆက်သွားမယ် 🤍</button>

/* =========================
   CREATE SCENES
========================= */

const app=document.getElementById("app");
const progress=document.getElementById("progress");
const nextBtn=document.getElementById("nextBtn");

let current=0;

scenes.forEach((scene,index)=>{

  const section=document.createElement("section");
  section.className="scene";
  if(index===0) section.classList.add("active");

  section.innerHTML=scene.html;

  app.appendChild(section);

  const dot=document.createElement("div");
  dot.className="dot";
  if(index===0) dot.classList.add("active");

  progress.appendChild(dot);
});


const allScenes=document.querySelectorAll(".scene");
const dots=document.querySelectorAll(".dot");


function update(){

  allScenes.forEach((s,i)=>{
    s.classList.toggle("active",i===current);
  });

  dots.forEach((d,i)=>{
    d.classList.toggle("active",i===current);
  });

  if(current===scenes.length-1){
    nextBtn.style.display="none";
  }else{
    nextBtn.style.display="block";
  }

}


/* =========================
   NEXT
========================= */

function nextScene(){

  if(current < scenes.length-1){

    current++;

    update();

    createHearts(3);
  }
}


/* =========================
   BUTTON ANSWER
========================= */

function answer(event){

  event.stopPropagation();

  createConfetti();
  createHearts(12);

  setTimeout(()=>{
    nextScene();
  },500);
}


/* =========================
   RESTART
========================= */

function restart(event){

  event.stopPropagation();

  current=0;
  update();

  createHearts(8);
}


/* =========================
   HEART EFFECT
========================= */

function createHearts(amount){

  for(let i=0;i<amount;i++){

    const h=document.createElement("div");

    h.className="heart";

    h.innerHTML=["🤍","💗","💕","🌷","✨"][Math.floor(Math.random()*5)];

    h.style.left=Math.random()*100+"%";
    h.style.bottom="-30px";
    h.style.fontSize=(15+Math.random()*22)+"px";
    h.style.animationDuration=(3+Math.random()*3)+"s";

    document.body.appendChild(h);

    setTimeout(()=>{
      h.remove();
    },6000);
  }
}


/* =========================
   CONFETTI
========================= */

function createConfetti(){

  for(let i=0;i<70;i++){

    const c=document.createElement("div");

    c.className="confetti";

    c.style.left=Math.random()*100+"%";
    c.style.animationDuration=(2+Math.random()*2)+"s";
    c.style.animationDelay=Math.random()*.4+"s";
    c.style.transform=`rotate(${Math.random()*360}deg)`;

    document.body.appendChild(c);

    setTimeout(()=>{
      c.remove();
    },4500);
  }
}


/* =========================
   TAP SCREEN
========================= */

document.addEventListener("click",(e)=>{

  if(
    e.target.tagName==="BUTTON" ||
    e.target.closest("button")
  ) return;

  if(current < scenes.length-1){
    nextScene();
  }

});


/* =========================
   SWIPE
========================= */

let touchStartY=0;

document.addEventListener("touchstart",(e)=>{
  touchStartY=e.changedTouches[0].screenY;
});

document.addEventListener("touchend",(e)=>{

  const endY=e.changedTouches[0].screenY;
  const difference=touchStartY-endY;

  if(Math.abs(difference)>50){

    if(difference>0 && current<scenes.length-1){
      nextScene();
    }

    if(difference<0 && current>0){
      current--;
      update();
    }

  }

});


update();

</script>

</body>
</html>
